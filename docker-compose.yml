services:

  frontend:
    image: frontend
    build:
      context: ./frontend
    depends_on:
      - api
    networks:
      - public
    ports:
      - 80:80

  config-server:
    image: config-server
    build:
      context: ./config-server
    networks:
      - private
    ports:
      - 8888:8888
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    image: gateway
    build:
      context: ./gateway
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - public
      - private
    restart: always
    ports:
      - 8080:8080

  discovery-server:
    image: discovery-server
    build:
      context: ./discovery-server
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - private
    restart: always
    ports:
      - 8761:8761

  api:
    image: api
    build:
      context: ./api
    depends_on:
      config-server:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - private
      - monitoring
    restart: always

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: api
      POSTGRES_USER: api
      POSTGRES_PASSWORD: api
    networks:
      - private
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api -d api"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v3.5.5
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    networks:
      - monitoring
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "3000:3000"
    networks:
      - monitoring

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./keycloak/theme/bookings:/opt/keycloak/themes/bookings:ro
    ports:
      - "8180:8080"
    networks:
      - public
      - private

networks:
  public:
  private:
  monitoring:

volumes:
  db-data: