server.port=8090

management.endpoints.web.exposure.include=env,health,info,prometheus,metrics

spring.threads.virtual.enabled=true

# Eureka configuration
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${random.value}

spring.datasource.url=jdbc:postgresql://db:5432/api
spring.datasource.username=${DB_USER:api}
spring.datasource.password=${DB_PASSWORD:api}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

# Disable old SQL scripts
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Liquibase configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.mvc.problemdetails.enabled=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/bookings/protocol/openid-connect/certs

logging.level.org.springframework.security=TRACE
